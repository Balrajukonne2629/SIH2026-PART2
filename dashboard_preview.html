  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = 'http://127.0.0.1:8000';

    async function apiRequest(path, options) {
      const url = `${API_BASE}${path}`;
      try {
        const res = await fetch(url, options);
        if (!res.ok) {
          let errorMsg = `HTTP ${res.status} ${res.statusText}`;
          try {
            const body = await res.json();
            if (body.detail) errorMsg = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
          } catch {}
          throw new Error(errorMsg);
        }
        return await res.json();
      } catch (err) {
        throw new Error(err.message || 'API connection failure');
      }
    }

    // --- COMPONENT: NAVBAR ---
    function Navbar({ currentScreen, onNavigate, unmappedCount }) {
      return (

          <div className="bg-slate-950 px-4 py-1 border-b border-slate-800/80 flex items-center justify-between text-xs tracking-wider text-slate-400">

            <div className="flex items-center space-x-4 font-mono text-[11px]">

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-14">

    // --- SCREEN 1: UPLOAD SCREEN ---
    function UploadScreen({ onAuditStarted, onNavigateToLedger }) {
      const [dragActive, setDragActive] = useState(false);
      const [selectedFileName, setSelectedFileName] = useState('labeled_test_config.txt');
      const [fileContent, setFileContent] = useState(SAMPLE_CONFIG);
      const [fileObj, setFileObj] = useState(null);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadError, setUploadError] = useState(null);

      const [ledgerEntries, setLedgerEntries] = useState([]);
      const [isLoadingLedger, setIsLoadingLedger] = useState(true);
      const fileInputRef = useRef(null);

      useEffect(() => {
        loadLedger();
      }, []);

      const loadLedger = async () => {
        setIsLoadingLedger(true);
        try {
          const data = await apiRequest('/api/ledger');
          setLedgerEntries(data || []);
        } catch (e) {
          console.error(e);
        } finally {
          setIsLoadingLedger(false);
        }
      };

      const handleExecute = async () => {
        setIsUploading(true);
        setUploadError(null);
        try {
          let res;
          if (fileObj) {
            const fd = new FormData();
            fd.append('file', fileObj);
            res = await apiRequest('/api/audit/upload', { method: 'POST', body: fd });
          } else {
            res = await apiRequest('/api/audit/upload', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ raw_config: fileContent, filename: selectedFileName })
            });
          }
          onAuditStarted(res.session_id, res);
        } catch (err) {
          setUploadError(err.message);
        } finally {
          setIsUploading(false);
        }
      };

      return (
        <div className="space-y-8 font-sans">
          <div className="border-b border-slate-800 pb-4 flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold text-white uppercase tracking-wide">
                Configuration Ingestion & Intake
              </h1>
              <p className="text-xs text-slate-400 mt-1">
                Upload raw Cisco IOS-XE configuration to execute deterministic CSM parsing and baseline compliance verification.
              </p>
            </div>
            <span className="inline-flex items-center px-2.5 py-0.5 rounded text-[11px] font-mono bg-slate-800 text-slate-300 border border-slate-700">
              TARGET: CISCO_IOS_XE_CSM_V1
            </span>
          </div>

          {uploadError && (
            <div className="bg-rose-950/60 border border-rose-700 rounded p-4 text-xs text-rose-200">
              <strong>Upload Error:</strong> {uploadError}
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-8 space-y-4">
              <div
                onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
                onDragLeave={() => setDragActive(false)}
                onDrop={(e) => {
                  e.preventDefault();
                  setDragActive(false);
                  if (e.dataTransfer.files?.[0]) {
                    const f = e.dataTransfer.files[0];
                    setSelectedFileName(f.name);
                    setFileObj(f);
                    const r = new FileReader();
                    r.onload = (ev) => setFileContent(ev.target.result);
                    r.readAsText(f);
                  }
                }}
                className={`border-2 border-dashed rounded p-8 text-center transition-all ${
                  dragActive ? 'border-sky-500 bg-sky-950/20' : 'border-slate-700 bg-slate-900/60 hover:border-slate-600'
                }`}
              >
                <input
                  ref={fileInputRef}
                  type="file"
                  accept=".cfg,.txt,.conf,.log"
                  onChange={(e) => {
                    if (e.target.files?.[0]) {
                      const f = e.target.files[0];
                      setSelectedFileName(f.name);
                      setFileObj(f);
                      const r = new FileReader();
                      r.onload = (ev) => setFileContent(ev.target.result);
                      r.readAsText(f);
                    }
                  }}
                  className="hidden"
                />

                  </svg>
                </div>
                <h3 className="text-sm font-semibold text-slate-200">
                  Select or Drag & Drop Cisco IOS-XE Configuration File
                </h3>
                <p className="text-xs text-slate-400 mt-1">
                  Supports standard Cisco CLI output (<code className="font-mono text-slate-300">show running-config</code>), .txt or .cfg
                </p>
                <div className="mt-5 flex items-center justify-center gap-3">
                  <button
                    type="button"
                    onClick={() => fileInputRef.current?.click()}
                    className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs font-medium cursor-pointer"
                  >
                    Browse Local File
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setSelectedFileName('labeled_test_config.txt');
                      setFileContent(SAMPLE_CONFIG);
                      setFileObj(null);
                    }}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs font-mono border border-slate-700 cursor-pointer"
                  >
                    Load Canonical Test Config (EDGE-RTR-01)
                  </button>
                </div>
              </div>

              {selectedFileName && (
                <div className="bg-slate-900 border border-slate-800 rounded p-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                    <span className="text-xs font-semibold uppercase text-slate-300">
                      Staged Configuration Payload
                    </span>
                    <span className="font-mono text-[11px] text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2 py-0.5 rounded">
                      READY FOR AUDIT
                    </span>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs font-mono mb-4">
                    <div>
                      <span className="text-slate-500 block text-[10px] uppercase">File Name</span>
                      <span className="text-slate-200 font-bold">{selectedFileName}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block text-[10px] uppercase">Size</span>
                      <span className="text-slate-200">{fileContent.length} bytes</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block text-[10px] uppercase">Lines</span>
                      <span className="text-slate-200">{fileContent.split('\n').length}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block text-[10px] uppercase">Vendor</span>
                      <span className="text-slate-200">Cisco IOS-XE</span>
                    </div>
                  </div>
                  <div className="flex justify-end">
                    <button
                      type="button"
                      disabled={isUploading}
                      onClick={handleExecute}
                      className="px-6 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs font-bold uppercase tracking-wider transition-colors shadow-sm flex items-center gap-2 border border-sky-400 cursor-pointer disabled:opacity-50"
                    >
                      {isUploading ? 'Executing Deterministic Audit...' : 'Execute Deterministic Audit'}
                    </button>
                  </div>
                </div>
              )}
            </div>

            <div className="lg:col-span-4 space-y-4">
              <div className="bg-slate-900 border border-slate-800 rounded p-4">
                <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider mb-3">
                  CSM Audit Protocol Verification
                </h4>
                <div className="space-y-3 text-xs text-slate-400">
                  <div className="border-l-2 border-emerald-500 pl-2.5 py-0.5">
                    <div className="text-slate-200 font-medium">100% Deterministic Rule Engine</div>
                    <div className="text-[11px] text-slate-400 mt-0.5">Fixed CSM conditions. Zero drift.</div>
                  </div>
                  <div className="border-l-2 border-amber-500 pl-2.5 py-0.5">
                    <div className="text-slate-200 font-medium">Isolated AI Suggestion Sandbox</div>
                    <div className="text-[11px] text-slate-400 mt-0.5">Requires explicit human approval.</div>
                  </div>
                  <div className="border-l-2 border-sky-500 pl-2.5 py-0.5">
                    <div className="text-slate-200 font-medium">Cryptographic Hash Chaining</div>
                    <div className="text-[11px] text-slate-400 mt-0.5">Linked entries in audit_log.jsonl.</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded">
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-200">
                Recent Audits Log (Ledger Source of Truth)
              </h3>
              <button onClick={loadLedger} className="text-[11px] font-mono text-sky-400 cursor-pointer">↻ Refresh</button>
            </div>
            {isLoadingLedger ? (
              <div className="p-8 text-center text-xs text-slate-400 font-mono">Loading ledger...</div>
            ) : ledgerEntries.length === 0 ? (
              <div className="p-8 text-center space-y-2">
                <h4 className="text-sm font-bold text-slate-300">No Prior Audits in Ledger</h4>
                <p className="text-xs text-slate-400">
                  The cryptographic ledger (audit_log.jsonl) has no records yet because no compliance audits have been finalized.
                </p>
                <p className="text-xs text-sky-400 font-mono">Upload a config above and finalize to create the first block.</p>
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="min-w-full divide-y divide-slate-800 text-left">
                  <thead className="bg-slate-950 font-mono text-[11px] text-slate-400 uppercase tracking-wider">
                    <tr>
                      <th className="py-2.5 px-4 font-semibold">Sequence & ID</th>
                      <th className="py-2.5 px-4 font-semibold">Device</th>
                      <th className="py-2.5 px-4 font-semibold">Timestamp</th>
                      <th className="py-2.5 px-4 font-semibold">Config Hash</th>
                      <th className="py-2.5 px-4 font-semibold text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60 font-sans text-xs">
                    {ledgerEntries.map((entry, idx) => (
                      <tr key={idx} className="hover:bg-slate-800/40">
                        <td className="py-3 px-4 font-mono font-bold text-sky-400">#{idx + 1} {entry.entry_id}</td>
                        <td className="py-3 px-4 font-mono text-slate-200">{entry.device_hostname}</td>
                        <td className="py-3 px-4 text-slate-400 font-mono text-[11px]">{entry.timestamp}</td>
                        <td className="py-3 px-4 font-mono text-[11px] text-slate-400">{(entry.config_file_hash || '').substring(0, 16)}...</td>
                        <td className="py-3 px-4 text-right">
                          <button onClick={onNavigateToLedger} className="px-2.5 py-1 rounded bg-slate-800 text-sky-400 text-xs font-mono cursor-pointer">
                            Inspect &rarr;
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- SCREEN 2: AUDIT RESULTS SCREEN ---
    function AuditResultsScreen({ sessionId, initialResults, onReviewAiSuggestions, onViewRemediation, onNavigateToLedger }) {
      const [data, setData] = useState(initialResults || null);
      const [isLoading, setIsLoading] = useState(!initialResults);
      const [error, setError] = useState(null);
      const [expanded, setExpanded] = useState({});
      const [filter, setFilter] = useState('ALL');

      useEffect(() => {
        if (sessionId) load();
      }, [sessionId]);

      const load = async () => {
        setIsLoading(true);
        setError(null);
        try {
          const res = await apiRequest(`/api/audit/${sessionId}/results`);
          setData(res);
        } catch (e) {
          setError(e.message);
        } finally {
          setIsLoading(false);
        }
      };

      if (isLoading) return <div className="p-12 text-center text-xs font-mono text-slate-300">Loading session {sessionId}...</div>;
      if (error || !data) return <div className="p-8 text-center text-xs text-rose-300 font-mono">Error: {error}</div>;

      const rulesList = Object.entries(data.rule_results || {}).map(([rid, d]) => ({
        ruleId: rid,
        focus: d.focus || 'Security Control',
        status: d.status || 'Unknown',
        evidenceFound: d.evidence_found || []
      }));

      const passCount = rulesList.filter(r => r.status === 'Pass').length;
      const failCount = rulesList.filter(r => r.status === 'Fail').length;
      const unknownCount = rulesList.filter(r => r.status === 'Unknown').length;

      const filtered = rulesList.filter(r => filter === 'ALL' || r.status === filter);
      const unmapped = data.unmapped_lines || [];

      return (
        <div className="space-y-6 font-sans">
          <div className="bg-slate-900 border border-slate-800 rounded p-5">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-slate-800 pb-4">
              <div>
                <div className="flex items-center space-x-3">
                  <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                  <h1 className="text-xl font-bold text-white uppercase font-mono">{data.device_hostname}</h1>
                  <span className="px-2 py-0.5 rounded text-[11px] font-mono bg-slate-800 text-slate-300 border border-slate-700">
                    {data.platform}
                  </span>
                </div>
                <p className="text-xs text-slate-400 mt-1 font-mono">Session ID: <code className="text-sky-300">{sessionId}</code></p>
              </div>
              <div className="flex gap-2">
                <button onClick={load} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs font-mono border border-slate-700 cursor-pointer">↻ Refresh</button>
                <button onClick={onNavigateToLedger} className="px-3 py-1.5 bg-slate-800 text-sky-400 rounded text-xs font-mono border border-slate-700 cursor-pointer">Ledger & Reports &rarr;</button>
              </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 text-xs font-mono">
              <div>
                <span className="text-slate-500 block text-[10px] uppercase">SHA-256 Hash</span>
                <span className="text-sky-400">{(data.config_file_hash || '').substring(0, 24)}...</span>
              </div>
              <div>
                <span className="text-slate-500 block text-[10px] uppercase">Evaluation</span>
                <span className="text-emerald-400 font-semibold">Deterministic Modules 2 & 4</span>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div onClick={() => setFilter('ALL')} className="p-4 rounded border bg-slate-900 border-slate-800 cursor-pointer">
              <div className="text-[11px] font-mono text-slate-400 uppercase">Total Controls</div>
              <div className="text-2xl font-bold font-mono text-slate-100 mt-1">{rulesList.length}</div>
            </div>
            <div onClick={() => setFilter('Pass')} className="p-4 rounded border bg-[#0c1f17] border-emerald-900/60 cursor-pointer">
              <div className="text-[11px] font-mono text-emerald-400 uppercase">Pass Count</div>
              <div className="text-2xl font-bold font-mono text-emerald-300 mt-1">{passCount}</div>
            </div>
            <div onClick={() => setFilter('Fail')} className="p-4 rounded border bg-[#220d0f] border-rose-900/60 cursor-pointer">
              <div className="text-[11px] font-mono text-rose-400 uppercase">Fail Count</div>
              <div className="text-2xl font-bold font-mono text-rose-300 mt-1">{failCount}</div>

              <div className="text-[11px] font-mono text-amber-400 uppercase">Unknown Count</div>
              <div className="text-2xl font-bold font-mono text-amber-300 mt-1">{unknownCount}</div>
            </div>

          {unmapped.length > 0 && (
            <div className="bg-amber-950/40 border-2 border-dashed border-amber-600/80 rounded p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <h4 className="text-sm font-bold text-amber-200">{unmapped.length} Unmapped Line{unmapped.length > 1 ? 's' : ''} Detected — AI Interpretation Available</h4>
                  <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-amber-900 text-amber-200 border border-amber-700 font-semibold">PENDING REVIEW</span>
                </div>
                <div className="mt-1.5 space-y-1">
                  {unmapped.map((line, idx) => (
                    <div key={idx} className="text-xs text-amber-300/90 flex flex-wrap items-center gap-1.5">
                      {unmapped.length > 1 && <span className="text-[10px] font-mono text-amber-400 font-bold">#{idx + 1}</span>}
                      <code className="font-mono bg-amber-950 px-1.5 py-0.5 rounded border border-amber-800 text-amber-200 font-semibold">{line}</code>
                      <span className="text-[11px] text-amber-300/70">not matched by deterministic rules. Candidate CSM mapping available.</span>
                    </div>
                  ))}
                </div>
              </div>
              <button onClick={() => onReviewAiSuggestions(unmapped[0])} className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 rounded text-xs font-bold uppercase cursor-pointer shrink-0">
                Review AI Suggestions &rarr;
              </button>
            </div>
          )}

          <div className="bg-slate-900 border border-slate-800 rounded">
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-200">Evaluated Rule Matrix</h3>
              <div className="flex gap-2">

                  <button key={f} onClick={() => setFilter(f)} className={`px-2 py-0.5 text-[11px] font-mono rounded cursor-pointer ${filter === f ? 'bg-slate-800 text-sky-400' : 'text-slate-400'}`}>
                    {f}

                <thead className="bg-slate-950 font-mono text-[11px] text-slate-400 uppercase">
                  <tr>
                    <th className="py-3 px-4">Rule ID</th>
                    <th className="py-3 px-4">Focus</th>
                    <th className="py-3 px-4">Verdict</th>
                    <th className="py-3 px-4">Evidence</th>
                    <th className="py-3 px-4 text-right">Action</th>

                  {filtered.map((r) => (
                    <tr key={r.ruleId} className="hover:bg-slate-800/30">
                      <td className="py-3 px-4 font-mono font-bold text-sky-400">{r.ruleId}</td>
                      <td className="py-3 px-4 text-slate-200">{r.focus}</td>

                        <span className={`inline-flex px-2 py-0.5 rounded text-[10px] font-mono font-bold ${

                          r.status === 'Fail' ? 'bg-[#fee2e2] text-[#991b1b]' :

                            Remediate &rarr;
                          </button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- SCREEN 3: AI SUGGESTION REVIEW SCREEN ---
    function AiSuggestionReviewScreen({ unmappedLine, sessionId, onApprovalCompleted, onBackToAudit }) {
      const [sug, setSug] = useState(null);
      const [sugId, setSugId] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState(null);
      const [reviewer, setReviewer] = useState('SecOps_Lead_Reviewer');
      const [isEditing, setIsEditing] = useState(false);
      const [title, setTitle] = useState('');
      const [field, setField] = useState('');
      const [cond, setCond] = useState('');
      const [success, setSuccess] = useState(null);

      useEffect(() => {
        load();
      }, [unmappedLine]);

      const load = async () => {
        setIsLoading(true);
        setError(null);
        try {
          const res = await apiRequest('/api/ai/suggest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ unmapped_line: unmappedLine })
          });
          setSugId(res.suggestion_id);
          setSug(res.suggestion);
          if (res.suggestion?.suggested_new_rule) {
            setTitle(res.suggestion.suggested_new_rule.internalTitle || '');
            setField(res.suggestion.suggested_new_rule.csmFieldChecked || '');
            setCond(res.suggestion.suggested_new_rule.condition || '');
          }
        } catch (e) {
          setError(e.message);
        } finally {
          setIsLoading(false);
        }
      };

      const handleDecision = async (dec) => {
        try {
          let corrected = undefined;
          if (dec === 'approve_with_correction') {
            corrected = {
              common_rule_id: 'COMMON-DIAG-001',
              vendor_rule_id: 'CISCO-DIAG-001',
              internalTitle: title,
              csmFieldChecked: field,
              condition: cond
            };
          }
          const res = await apiRequest('/api/ai/approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              suggestion_id: sugId,
              reviewer_name: reviewer,
              decision: dec,
              corrected_mapping: corrected,
              session_id: sessionId
            })
          });
          setSuccess(res);
        } catch (e) {
          alert('Approval error: ' + e.message);
        }
      };

      if (isLoading) return <div className="p-12 text-center text-xs font-mono text-slate-300">Running local DistilBERT inference on: {unmappedLine}...</div>;
      if (error || !sug) return <div className="p-8 text-center text-xs text-rose-300 font-mono">Error: {error}</div>;

      const hints = sug.framework_hints || [];

      return (
        <div className="space-y-6 font-sans">
          <div className="border-b border-slate-800 pb-4 flex items-center justify-between">
            <div>
              <button onClick={onBackToAudit} className="text-xs text-sky-400 font-mono mb-2 cursor-pointer">&larr; Back to Results</button>
              <h1 className="text-xl font-bold text-white uppercase">AI Suggestion Queue & Operator Review</h1>
            </div>
          </div>

          <div className="bg-amber-950/30 border border-amber-800/80 rounded p-4 text-xs text-amber-300 font-mono">
            SAFETY NOTICE: AI suggestions do not decide compliance. Approval converts suggestion into a trusted rule in trusted_mappings.json.
          </div>

          <div className="bg-slate-900 border-2 border-dashed border-amber-600 rounded p-6 space-y-4">
            <div>
              <span className="text-xs font-mono text-slate-400 uppercase font-semibold">Raw CLI Line:</span>
              <div className="bg-slate-950 p-3 rounded font-mono text-sm text-amber-300 mt-1">{unmappedLine}</div>
            </div>

            <div className="bg-slate-950 p-4 rounded border border-slate-800 space-y-3">
              <div className="flex justify-between items-center text-xs font-mono">
                <span className="text-slate-400 uppercase">Confidence</span>
                <span className="text-emerald-400 font-bold">{Math.round(sug.confidence * 100)}%</span>
              </div>
              <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div className="bg-emerald-500 h-full" style={{ width: `${Math.round(sug.confidence * 100)}%` }}></div>
              </div>

              {!isEditing ? (
                <div className="text-xs font-mono space-y-2 pt-2">
                  <div><span className="text-slate-500 block text-[10px]">SUGGESTED TITLE:</span> <span className="text-slate-200 font-semibold">{title}</span></div>
                  <div><span className="text-slate-500 block text-[10px]">CSM FIELD:</span> <code className="text-sky-400">{field}</code></div>
                  <div><span className="text-slate-500 block text-[10px]">CONDITION:</span> <code className="text-amber-300">{cond}</code></div>
                </div>
              ) : (
                <div className="space-y-3 pt-2">
                  <div>
                    <label className="text-[10px] font-mono text-slate-400 uppercase block">Title</label>
                    <input className="w-full bg-slate-900 border border-slate-700 p-2 text-xs font-mono text-slate-200 rounded" value={title} onChange={(e) => setTitle(e.target.value)} />
                  </div>
                  <div>
                    <label className="text-[10px] font-mono text-slate-400 uppercase block">Field</label>
                    <input className="w-full bg-slate-900 border border-slate-700 p-2 text-xs font-mono text-slate-200 rounded" value={field} onChange={(e) => setField(e.target.value)} />
                  </div>
                  <div>
                    <label className="text-[10px] font-mono text-slate-400 uppercase block">Condition</label>
                    <input className="w-full bg-slate-900 border border-slate-700 p-2 text-xs font-mono text-slate-200 rounded" value={cond} onChange={(e) => setCond(e.target.value)} />
                  </div>
                </div>
              )}

              <div className="pt-2 border-t border-slate-800 text-xs text-slate-300 font-sans">
                <strong>Rationale:</strong> {sug.rationale}
              </div>

              {hints.length > 0 && (
                <div className="pt-2 border-t border-slate-800">
                  <span className="text-[10px] font-mono text-slate-400 uppercase block mb-1">Framework Hints (Real API Response):</span>
                  <div className="flex gap-2">
                    {hints.map((h, i) => (
                      <span key={i} className="px-2 py-1 bg-slate-900 border border-slate-700 text-xs font-mono text-sky-300 rounded">
                        {h.framework}: {h.possible_control_id}
                      </span>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <div className="flex justify-between items-center pt-2">
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono text-slate-400 uppercase">Reviewer:</span>
                <input className="bg-slate-950 border border-slate-700 px-2 py-1 text-xs font-mono text-sky-300 rounded" value={reviewer} onChange={(e) => setReviewer(e.target.value)} />
              </div>

              {!success ? (
                <div className="flex gap-2">
                  <button onClick={() => handleDecision('reject')} className="px-4 py-2 bg-rose-950 hover:bg-rose-900 text-rose-300 text-xs font-mono font-bold rounded cursor-pointer">
                    Reject
                  </button>
                  {!isEditing ? (
                    <button onClick={() => setIsEditing(true)} className="px-4 py-2 bg-slate-800 text-slate-200 text-xs font-mono font-bold rounded cursor-pointer">
                      Edit...
                    </button>
                  ) : (
                    <button onClick={() => handleDecision('approve_with_correction')} className="px-4 py-2 bg-sky-600 text-white text-xs font-mono font-bold rounded cursor-pointer">
                      Approve with Correction
                    </button>
                  )}
                  {!isEditing && (
                    <button onClick={() => handleDecision('approve')} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 text-xs font-mono font-bold rounded cursor-pointer">
                      Approve as Trusted
                    </button>
                  )}
                </div>
              ) : (
                <div className="flex items-center gap-3">
                  <span className="text-xs font-mono text-emerald-400">Action recorded ({success.status})!</span>
                  <button onClick={onApprovalCompleted} className="px-4 py-2 bg-sky-600 text-white text-xs font-mono font-bold rounded cursor-pointer">
                    Return to Results &rarr;
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- SCREEN 4: REMEDIATION DETAIL SCREEN ---
    function RemediationDetailScreen({ ruleId, sessionId, onBackToAudit, onAuditFinalized }) {
      const [data, setData] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState(null);
      const [copied, setCopied] = useState(false);
      const [isFinalizing, setIsFinalizing] = useState(false);

      useEffect(() => {
        load();
      }, [ruleId, sessionId]);

      const load = async () => {
        setIsLoading(true);
        setError(null);
        try {
          const res = await apiRequest(`/api/remediation/${ruleId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: sessionId })
          });
          setData(res);
        } catch (e) {
          setError(e.message);
        } finally {
          setIsLoading(false);
        }
      };

      const handleFinalize = async () => {
        setIsFinalizing(true);
        try {
          const remSummary = {
            rule_id: ruleId,
            remediation_cmd: data.remediation_cmd,
            has_conflicts: data.has_conflicts,
            conflict_count: data.conflict_count,
            conflicts: data.conflicts,
            why_it_failed: data.why_it_failed,
            what_remediation_does: data.what_remediation_does
          };
          const fin = await apiRequest('/api/audit/finalize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: sessionId, remediation_summary: remSummary })
          });
          onAuditFinalized(fin);
        } catch (e) {
          alert('Finalization failed: ' + e.message);
        } finally {
          setIsFinalizing(false);
        }
      };

      if (isLoading) return <div className="p-12 text-center text-xs font-mono text-slate-300">Generating Jinja2 patch and static conflicts for {ruleId}...</div>;
      if (error || !data) return <div className="p-8 text-center text-xs text-rose-300 font-mono">Error: {error}</div>;

      const conflicts = data.conflicts || [];

      return (
        <div className="space-y-6 font-sans">
          <div className="border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
              <button onClick={onBackToAudit} className="text-xs text-sky-400 font-mono mb-2 cursor-pointer">&larr; Back to Results</button>
              <h1 className="text-xl font-bold text-white uppercase">Remediation Detail & Static Conflict Analyzer</h1>
            </div>
            <button
              onClick={handleFinalize}
              disabled={isFinalizing}
              className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-mono text-xs font-bold uppercase rounded cursor-pointer disabled:opacity-50"
            >
              {isFinalizing ? 'Finalizing & Signing...' : 'Finalize Audit & Record to Ledger &rarr;'}
            </button>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded p-5 space-y-4">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <span className="font-mono text-lg font-bold text-sky-400">{ruleId}</span>
              <span className="px-2 py-0.5 rounded text-xs font-mono font-bold bg-[#fee2e2] text-[#991b1b]">FAIL</span>
            </div>

            <div className="bg-slate-950 p-4 rounded border-l-4 border-l-rose-500 text-xs text-slate-300 font-sans leading-relaxed">
              <strong className="block font-mono text-rose-300 uppercase mb-1">Root Cause Explanation (DistilBERT):</strong>
              {data.why_it_failed}
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded p-5 space-y-3">
            <div className="flex justify-between items-center">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-200">Generated Remediation CLI</h3>
              <button
                onClick={() => {
                  navigator.clipboard.writeText(data.remediation_cmd);
                  setCopied(true);
                  setTimeout(() => setCopied(false), 2000);
                }}
                className="px-3 py-1 bg-slate-800 text-sky-400 text-xs font-mono rounded cursor-pointer"
              >
                {copied ? 'Copied!' : 'Copy Command'}
              </button>
            </div>
            <pre className="bg-slate-950 p-4 rounded text-xs font-mono text-emerald-300 overflow-x-auto">{data.remediation_cmd}</pre>
            <div className="bg-rose-950/40 border border-rose-800 rounded p-3 text-xs text-rose-300 font-mono">
              <strong>SAFETY NOTICE: DISPLAY ONLY — NOT AUTO-EXECUTED</strong>
              <p className="mt-0.5 text-[11px] text-rose-300/80">Automated execution is structurally prohibited by architecture. Peer review required.</p>
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded p-5 space-y-4">
            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-200">Pre-Deployment Static Conflict Analysis</h3>
            {conflicts.length > 0 ? (
              <div className="space-y-3">
                {conflicts.map((c) => (
                  <div key={c.conflict_id} className="bg-rose-950/20 border border-rose-800/80 rounded p-4 text-xs space-y-2 font-mono">
                    <div className="flex justify-between items-center">
                      <span className="font-bold text-rose-300">{c.severity} SEVERITY: {c.title}</span>
                      <span className="text-slate-400">ID: {c.conflict_id}</span>
                    </div>
                    <p className="text-slate-300 font-sans">{c.description}</p>
                    <div className="bg-slate-950 p-2 rounded text-slate-200">Mitigation: {c.mitigation}</div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="bg-emerald-950/20 border border-emerald-800/80 rounded p-6 text-center text-xs font-mono text-emerald-300">
                NO CONFLICTS DETECTED
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- SCREEN 5: AUDIT LOG & REPORT SCREEN ---
    function AuditLogReportScreen() {
      const [entries, setEntries] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState(null);
      const [chainRes, setChainRes] = useState(null);
      const [isVerifying, setIsVerifying] = useState(false);
      const [pdfVerRes, setPdfVerRes] = useState({});

      useEffect(() => {
        load();
      }, []);

      const load = async () => {
        setIsLoading(true);
        try {
          const data = await apiRequest('/api/ledger');
          setEntries(data || []);
        } catch (e) {
          setError(e.message);
        } finally {
          setIsLoading(false);
        }
      };

      const handleVerifyChain = async () => {
        setIsVerifying(true);
        try {
          const res = await apiRequest('/api/ledger/verify');
          setChainRes(res);
        } catch (e) {
          setChainRes({ valid: false, message: e.message });
        } finally {
          setIsVerifying(false);
        }
      };

      const handleVerifyPdf = async (id) => {
        try {
          const res = await apiRequest(`/api/report/${id}/verify`);
          setPdfVerRes(p => ({ ...p, [id]: res }));
        } catch (e) {
          setPdfVerRes(p => ({ ...p, [id]: { valid: false, message: e.message } }));
        }
      };

      if (isLoading) return <div className="p-12 text-center text-xs font-mono text-slate-300">Loading ledger from backend...</div>;

      return (
        <div className="space-y-6 font-sans">
          <div className="bg-slate-900 border border-slate-800 rounded p-5 flex justify-between items-center">
            <div>
              <h1 className="text-xl font-bold text-white uppercase">Cryptographic Audit Ledger & Reports</h1>
              <p className="text-xs text-slate-400 mt-1 font-mono">Source: audit_log.jsonl</p>
            </div>
            <div className="flex gap-3">
              <button onClick={load} className="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-mono rounded cursor-pointer">↻ Reload</button>
              <button
                onClick={handleVerifyChain}
                disabled={isVerifying}
                className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs font-mono font-bold uppercase cursor-pointer"
              >
                {isVerifying ? 'Verifying...' : 'Verify Chain Integrity'}
              </button>
            </div>
          </div>

          {chainRes && (
            <div className={`p-4 rounded border font-mono text-xs ${chainRes.valid ? 'bg-emerald-950/40 border-emerald-700 text-emerald-300' : 'bg-rose-950/60 border-rose-600 text-rose-300'}`}>
              <strong>{chainRes.valid ? 'CHAIN VALIDATED' : 'TAMPER ALERT'}:</strong> {chainRes.message}
            </div>
          )}

          {entries.length === 0 ? (
            <div className="p-10 text-center bg-slate-900 rounded border border-slate-800 text-xs font-mono text-slate-400">
              No entries in ledger yet. Run an audit and click Finalize to add a block.
            </div>
          ) : (
            <div className="space-y-4">
              {entries.map((e, idx) => (
                <div key={idx} className="bg-slate-900 border border-slate-800 rounded p-4 space-y-3 font-mono text-xs">
                  <div className="flex justify-between items-center">
                    <span className="text-sky-400 font-bold">#{idx + 1} {e.entry_id}</span>
                    <span className="text-slate-400 text-[11px]">{e.timestamp}</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-[11px] text-slate-400 bg-slate-950 p-2.5 rounded">
                    <div>prevHash: <span className="text-slate-300 select-all">{e.prevEntryHash}</span></div>
                    <div>entryHash: <span className="text-emerald-400 select-all font-bold">{e.entryHash}</span></div>
                  </div>
                  <div className="flex justify-between items-center pt-2">
                    <button onClick={() => handleVerifyPdf(e.entry_id)} className="px-3 py-1 bg-slate-800 text-slate-300 text-xs rounded cursor-pointer">
                      Verify PDF Hash
                    </button>
                    <a
                      href={`${API_BASE}/api/report/${e.entry_id}/download`}
                      target="_blank"
                      download
                      className="px-3 py-1 bg-sky-950 text-sky-300 border border-sky-800 text-xs rounded cursor-pointer"
                    >
                      Download PDF &darr;
                    </a>
                  </div>
                  {pdfVerRes[e.entry_id] && (
                    <div className={`p-2 rounded text-[11px] ${pdfVerRes[e.entry_id].valid ? 'bg-emerald-950/50 text-emerald-300' : 'bg-rose-950/50 text-rose-300'}`}>
                      {pdfVerRes[e.entry_id].message}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- ROOT APP ---
    function RootApp() {
      const [screen, setScreen] = useState('upload');
      const [sessionId, setSessionId] = useState(null);
      const [cached, setCached] = useState(null);
      const [unmappedLine, setUnmappedLine] = useState('service call-home');
      const [remRuleId, setRemRuleId] = useState('CISCO-NTP-001');

      const handleAuditStarted = (sid, res) => {
        setSessionId(sid);
        setCached(res);
        setScreen('results');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          <Navbar currentScreen={screen} onNavigate={setScreen} unmappedCount={cached?.unmapped_lines?.length || 0} />
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {screen === 'upload' && (
              <UploadScreen onAuditStarted={handleAuditStarted} onNavigateToLedger={() => setScreen('audit_log')} />
            )}
            {screen === 'results' && (
              sessionId ? (
                <AuditResultsScreen
                  sessionId={sessionId}
                  initialResults={cached}
                  onReviewAiSuggestions={(line) => { setUnmappedLine(line); setScreen('ai_review'); }}
                  onViewRemediation={(rid) => { setRemRuleId(rid); setScreen('remediation'); }}
                  onNavigateToLedger={() => setScreen('audit_log')}
                />
              ) : (
                <div className="p-12 text-center font-mono text-xs text-slate-400">
                  No active audit session. <button onClick={() => setScreen('upload')} className="text-sky-400 underline">Upload config first</button>.
                </div>
              )
            )}
            {screen === 'ai_review' && (
              <AiSuggestionReviewScreen
                unmappedLine={unmappedLine}
                sessionId={sessionId}
                onApprovalCompleted={() => { setCached(null); setScreen('results'); }}
                onBackToAudit={() => setScreen('results')}
              />
            )}
            {screen === 'remediation' && (
              sessionId ? (
                <RemediationDetailScreen
                  ruleId={remRuleId}
                  sessionId={sessionId}
                  onBackToAudit={() => setScreen('results')}
                  onAuditFinalized={() => setScreen('audit_log')}
                />
              ) : (
                <div className="p-12 text-center font-mono text-xs text-slate-400">
                  Session required. <button onClick={() => setScreen('upload')} className="text-sky-400 underline">Upload config first</button>.
                </div>
              )
            )}
            {screen === 'audit_log' && <AuditLogReportScreen />}
          </main>
          <footer className="bg-slate-950 border-t border-slate-900 py-3 px-4 text-center font-mono text-[11px] text-slate-500">
            NTRO CYBER COMPLIANCE AUDITOR • CONNECTED TO BACKEND: http://127.0.0.1:8000
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RootApp />);
  </script>
</body>
</html>
